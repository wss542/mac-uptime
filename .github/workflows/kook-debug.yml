name: KOOK debug

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: test kook connectivity from runner
        env:
          KOOK_TOKEN: ${{ secrets.KOOK_TOKEN }}
          KOOK_CHANNEL: "1010983873136793"
          KOOK_API: "https://www.kookapp.cn/api/v3/message/create"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          token=os.environ["KOOK_TOKEN"]; channel=os.environ["KOOK_CHANNEL"]
          api=os.environ["KOOK_API"]; gh=os.environ["GH_TOKEN"]
          repo="wss542/mac-uptime"; target=17
          msg="# 🔧 KOOK 云端连通性自检\nGitHub runner 测试消息，确认能否到达 kookapp.cn。"
          payload={"target_id":channel,"content":msg,"type":9}
          result=""
          try:
              req=urllib.request.Request(api,data=json.dumps(payload).encode(),
                  headers={"Authorization":"Bot "+token,"Content-Type":"application/json"},method="POST")
              resp=urllib.request.urlopen(req,timeout=15).read().decode()
              result="KOOK_OK: "+resp[:200]
          except Exception as e:
              result="KOOK_FAIL: "+repr(e)
          print(result)
          try:
              r2=urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/{target}/comments",
                  data=json.dumps({"body":result}).encode(),
                  headers={"Authorization":f"Bearer {gh}","Accept":"application/vnd.github.v3+json","Content-Type":"application/json"},method="POST")
              urllib.request.urlopen(r2,timeout=20)
              print("comment posted to #17")
          except Exception as e:
              print("comment fail:",e)
          PY
