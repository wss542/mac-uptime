name: VM Down Alert (KOOK)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 探测 VM 并推送 KOOK 告警
        env:
          KOOK_TOKEN: ${{ secrets.KOOK_TOKEN }}
          KOOK_CHANNEL: "1010983873136793"
          TARGET_URL: "https://huanmeng-vm.python-wrasse.ts.net"
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, subprocess
          from datetime import datetime, timezone, timedelta

          # 取 token，并防御性剥掉可能多粘的 "KOOK_TOKEN=" 前缀与首尾空白
          raw = os.environ.get("KOOK_TOKEN", "")
          token = raw.strip()
          if token.startswith("KOOK_TOKEN="):
              token = token[len("KOOK_TOKEN="):].strip()
          channel = os.environ["KOOK_CHANNEL"].strip()
          url = os.environ["TARGET_URL"].strip()
          state_file = ".kook_alert_state"        # 只放 "up" / "down"
          ts_file = ".kook_down_since"            # 掉线开始的 unix 时间戳
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          CN = timezone(timedelta(hours=8))       # 北京时间

          def now_cn():
              return datetime.now(CN).strftime("%Y-%m-%d %H:%M:%S")

          def fmt_duration(seconds):
              seconds = int(max(0, seconds))
              h, rem = divmod(seconds, 3600)
              m, s = divmod(rem, 60)
              if h:
                  return f"{h} 小时 {m} 分 {s} 秒"
              if m:
                  return f"{m} 分 {s} 秒"
              return f"{s} 秒"

          print(f"[debug] token loaded, len={len(token)}, channel={channel}")

          def post_kook(content):
              payload = {"target_id": channel, "content": content, "type": 9}
              req = urllib.request.Request(
                  "https://www.kookapp.cn/api/v3/message/create",
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": "Bot " + token,
                           "Content-Type": "application/json"}, method="POST")
              try:
                  resp = urllib.request.urlopen(req, timeout=15).read().decode()
                  print("KOOK resp:", resp[:300])
                  data = json.loads(resp)
                  if data.get("code") != 0:
                      print("KOOK 返回错误:", data.get("code"), data.get("message"))
                      return False
                  return True
              except Exception as e:
                  print("KOOK send failed:", e)
                  return False

          # 手动触发：永远发一条自检，方便验证链路
          if manual:
              ok = post_kook("# 🔔 自检测试\n告警链路正常，KOOK 推送可达。\n"
                             f"探测地址：{url}\n触发时间：{now_cn()}")
              if not ok:
                  print("ERROR: 自检消息发送失败，工作流标记为失败")
                  raise SystemExit(1)
              print("manual test sent")
              raise SystemExit(0)

          # 调度触发：主动探测 VM（多点重试，抗跨境抖动）
          # ⚠️ 5xx / 超时 都不等于「VM 宕机」—— 可能只是 Cloudflare/Funnel 瞬时抖动。
          # 策略：每周期最多探 3 次，任一拿到 200 即判 up。
          def probe_once():
              """返回 (ok, detail)，ok=True 表示 HTTP 200。"""
              try:
                  r = urllib.request.urlopen(url, timeout=25)
                  if r.status == 200:
                      r.read(64)
                      return True, "200"
                  return False, "HTTP %s" % r.status
              except urllib.error.HTTPError as e:
                  return False, "HTTP %s" % e.code
              except Exception as e:
                  return False, "%s: %s" % (type(e).__name__, str(e)[:120])

          ok = False
          err_detail = ""
          attempts = 3
          for i in range(attempts):
              ok, err_detail = probe_once()
              print(f"[probe {i+1}/{attempts}] ok={ok} detail={err_detail}")
              if ok:
                  break
              if i < attempts - 1:
                  import time as _t
                  _t.sleep(5)

          current = "up" if ok else "down"

          # 迟滞：连续 2 个周期都失败才判 down（防单次抖动误报）
          fail_file = ".kook_probe_fail_count"
          prev_fail = 0
          if os.path.exists(fail_file):
              try:
                  prev_fail = int(open(fail_file).read().strip() or 0)
              except Exception:
                  prev_fail = 0
          if current == "down":
              fail_count = prev_fail + 1
              open(fail_file, "w").write(str(fail_count))
          else:
              fail_count = 0
              open(fail_file, "w").write("0")
          print(f"fail_count={fail_count} (need >=2 to alert)")

          prev = "up"
          if os.path.exists(state_file):
              prev = (open(state_file).read().strip() or "up")
          print(f"prev={prev} current={current}")

          # 未达迟滞阈值 → 按 up 处理，不告警、不改状态
          if current == "down" and fail_count < 2:
              print("单次探测失败但未达迟滞阈值(2)，按 up 处理，不告警")
              raise SystemExit(0)

          changed = False
          if current == "down" and prev != "down":
              ts = int(datetime.now(timezone.utc).timestamp())
              body = ("# ⚠️ 服务宕机告警\n"
                      "**Ubuntu VM 不可达**\n\n"
                      f"掉线开始：{now_cn()}\n"
                      f"探测地址：{url}\n"
                      f"已连续 {fail_count} 个周期探测失败（每周期重试 {attempts} 次）")
              if err_detail:
                  body += f"\n失败原因：{err_detail[:150]}"
              if not post_kook(body):
                  raise SystemExit(1)
              open(state_file, "w").write("down")
              open(ts_file, "w").write(str(ts))
              changed = True
          elif current == "up" and prev == "down":
              down_ts = 0
              try:
                  if os.path.exists(ts_file):
                      down_ts = int(open(ts_file).read().strip() or 0)
              except Exception:
                  down_ts = 0
              now_ts = int(datetime.now(timezone.utc).timestamp())
              body = ("# ✅ 服务已恢复\n"
                      "**Ubuntu VM 恢复正常**\n\n"
                      f"恢复时间：{now_cn()}")
              if down_ts > 0:
                  start_cn = datetime.fromtimestamp(down_ts, CN).strftime("%Y-%m-%d %H:%M:%S")
                  body += (f"\n掉线期间：{start_cn} ~ {now_cn()}"
                           f"\n本次中断时长：{fmt_duration(now_ts - down_ts)}")
              body += f"\n探测地址：{url}"
              if not post_kook(body):
                  raise SystemExit(1)
              open(state_file, "w").write("up")
              if os.path.exists(ts_file):
                  os.remove(ts_file)
              if os.path.exists(fail_file):
                  open(fail_file, "w").write("0")
              changed = True
          else:
              print("状态未变化，不推送")
              raise SystemExit(0)

          if changed:
              subprocess.run(["git", "add", "-A"], check=False)
              subprocess.run(["git", "config", "user.email", "bot@github.com"], check=False)
              subprocess.run(["git", "config", "user.name", "github-actions"], check=False)
              subprocess.run(["git", "commit", "-m", "chore: update alert state"], check=False)
              subprocess.run(["git", "push"], check=False)
          PY
