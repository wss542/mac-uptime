name: Notify KOOK on downtime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  notify-kook:
    runs-on: ubuntu-latest
    steps:
      - name: Scan downtime issues and alert KOOK
        env:
          KOOK_TOKEN: ${{ secrets.KOOK_TOKEN }}
          KOOK_CHANNEL: "1010983873136793"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess, urllib.request

          token = os.environ["KOOK_TOKEN"]
          channel = os.environ["KOOK_CHANNEL"]
          repo = "wss542/mac-uptime"

          def gh_list():
              r = subprocess.run(
                  ["gh", "issue", "list", "--repo", repo, "--state", "all",
                   "--json", "number,title,state,labels,url"],
                  capture_output=True, text=True)
              if r.returncode != 0:
                  print("gh err:", r.stderr)
                  return []
              return json.loads(r.stdout)

          def post_kook(title, url):
              msg = (f"# ⚠️ 服务宕机告警 (Mac VM Uptime)\n**{title}**\n\n"
                     f"[在 GitHub 查看详情]({url})")
              payload = {"target_id": channel, "content": msg, "type": 9}
              req = urllib.request.Request(
                  "https://www.kookapp.com/api/v3/message/create",
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": "Bot " + token,
                           "Content-Type": "application/json"},
                  method="POST")
              try:
                  resp = urllib.request.urlopen(req, timeout=15).read().decode()
                  print("KOOK resp:", resp[:200])
              except Exception as e:
                  print("KOOK send failed:", e)
                  raise

          def label(num, action, name):
              subprocess.run(
                  ["gh", "issue", "edit", str(num), "--repo", repo,
                   action, name], capture_output=True, text=True)

          for it in gh_list():
              t = it["title"].lower()
              if "is down" not in t and "is reachable" not in t:
                  continue
              labels = [l["name"] for l in it["labels"]]
              num = it["number"]
              if it["state"] == "open":
                  if "kook-alerted" in labels:
                      continue
                  post_kook(it["title"], it["url"])
                  label(num, "--add-label", "kook-alerted")
                  print(f"alerted issue #{num}")
              else:  # closed = recovered
                  if "kook-alerted" in labels:
                      recovered = it["title"].replace("is down", "已恢复")
                      post_kook("✅ " + recovered, it["url"])
                      label(num, "--remove-label", "kook-alerted")
                      label(num, "--add-label", "kook-recovered")
                      print(f"recovered issue #{num}")
          print("done")
          PY
